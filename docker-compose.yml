services:
  hxsg:
    build: .
    container_name: hxsg-classic-web
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HXSG_DATA_DIR=/data
      - HXSG_SECRET=${HXSG_SECRET:-change-this-secret-in-production}
      - HXSG_GM_CODE=${HXSG_GM_CODE:-hxsg888}
    volumes:
      - ./data:/data
    deploy:
      resources:
        limits:
          memory: 1G
